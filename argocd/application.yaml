apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supply-chain-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/adeola2021/phase6-gitops.git
    targetRevision: HEAD
    path: app

  destination:
    server: https://kubernetes.default.svc
    namespace: supply-chain-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
